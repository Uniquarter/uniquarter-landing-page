# Tests and deploys the sign-up Worker when anything under worker/ changes on
# main. The secrets live in this repository's GitHub settings and are pushed to
# the Worker on each deploy, so no key is ever written in the code.
name: Sign-up Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signup-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          packageManager: npm
          secrets: |
            RESEND_API_KEY
            RESEND_SEGMENT_ID
            TOKEN_KEY
            TURNSTILE_SECRET
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
